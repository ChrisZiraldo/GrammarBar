name: GrammarBar

options:
  bundleIdPrefix: com.grammarbar
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  # Pin the generated project's file format (objectVersion) to Xcode 15.3.
  # Without this, xcodegen defaults to the newest format it knows (Xcode 16,
  # objectVersion 77), which the GitHub Actions macos-14 runner's default
  # Xcode (15.4) cannot open: "future Xcode project file format (77)".
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_LDFLAGS: "$(inherited)"

targets:
  GrammarBar:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/GrammarBar
        excludes:
          - Resources/**
      - path: Sources/GrammarBar/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - GrammarBar.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grammarbar.app
        INFOPLIST_FILE: Sources/GrammarBar/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/GrammarBar/Resources/GrammarBar.entitlements
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        PRODUCT_NAME: GrammarBar
    preBuildScripts:
      - name: Make llama-server executable
        script: |
          BINARY="${SRCROOT}/Sources/GrammarBar/Resources/llama-server"
          if [ -f "$BINARY" ]; then
            chmod +x "$BINARY"
          fi
        basedOnDependencyAnalysis: false

  # Unit tests for the pure text logic (diffing, dictionary enforcement). These
  # compile the Foundation-only source files directly instead of hosting the app,
  # so they run fast and don't need any permissions or a signed host binary.
  GrammarBarTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests/GrammarBarTests
      - path: Sources/GrammarBar/Correction/WordDiff.swift
      - path: Sources/GrammarBar/Correction/TextRules.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grammarbar.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
